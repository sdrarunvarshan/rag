version: '3.8'

services:
  garage:
    image: dxflrs/garage:v2.4.0
    container_name: garage
    ports:
      - "3900:3900"  # S3 API
      - "3902:3902"  # Web UI
    environment:
      - RUST_LOG=info
    volumes:
      - garage_data:/data
      - ./garage-config.toml:/etc/garage.toml:ro
    command: /garage server 
    restart: unless-stopped

volumes:
  garage_data:
