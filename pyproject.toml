[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sdrarunvarshan", email = "sdrarunvarshan@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "arize-phoenix>=20.0.0",
    "arize-phoenix-otel>=0.16.0",
    "deepeval>=2.10.0",
    "docling>=2.129.0",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.10",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.12",
    "openai>=3.16.2",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-instrumentation-langchain>=0.47b0",
    "opentelemetry-sdk>=1.30.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "ragas>=0.2.1",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "temporalio>=1.8.0",
    "uvicorn>=0.53.0",
    "valkey>=6.1.1",
]

[project.scripts]
rag = "rag:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
